name: Metrics
on:
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore: ["metrics/**"]

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Isometric contributions
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: MatHoyer
          template: classic
          base: ""
          filename: metrics/isometric.svg
          committer_branch: main
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: MatHoyer
          template: classic
          filename: metrics/overview.svg
          committer_branch: main
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Paris

      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: MatHoyer
          template: classic
          base: ""
          filename: metrics/languages.svg
          committer_branch: main
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage

      - name: Lines of code
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: MatHoyer
          template: classic
          base: ""
          filename: metrics/lines.svg
          committer_branch: main
          plugin_lines: yes
          plugin_lines_sections: base
